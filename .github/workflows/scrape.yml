name: Scraper diario

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 06:00 hora Perú (UTC-5)
  workflow_dispatch: {}     # permite ejecutarlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pandas openpyxl lxml playwright
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          MCW_USER: ${{ secrets.MCW_USER }}
          MCW_PASS: ${{ secrets.MCW_PASS }}
        run: python scraper_modelcarswholesale.py --engine playwright --login

      - name: Subir debug (si el login falló)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-login
          path: |
            debug_login.png
            debug_login.html
          if-no-files-found: ignore

      - name: Commitear catálogo actualizado
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add productos_actuales.csv
          git diff --staged --quiet || git commit -m "Actualizacion diaria de catalogo"
          git push
