name: Scraping diario del catálogo

on:
  schedule:
    # 08:00 UTC = 3:00 AM en Perú (UTC-5). Ajusta si quieres otro horario.
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # te deja correrlo manualmente desde la pestaña Actions de GitHub

jobs:
  scraping:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml pandas gspread google-auth playwright
      
      - name: Instalar navegador de Playwright (solo si usas --engine playwright)
        run: playwright install chromium --with-deps

      - name: Escribir credenciales de Google desde el Secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credenciales_google.json

      - name: Correr el scraper y sincronizar con MATRIZ A PEDIDO
        run: python scraper_modelcarswholesale.py --engine requests --sincronizar
